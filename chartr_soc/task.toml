schema_version = "1.4"
artifacts = [{ source = "/evidence/snapshot.json", service = "clinic" }]

[task]
name = "chartr/standard-of-care"
version = "0.1.0"
description = "Determine syphilis follow-up status from charts under CDC guidance and chart-level clinic instructions"

[agent]
timeout_sec = 3600

[environment]
network_mode = "public"
build_timeout_sec = 600
cpus = 1
memory_mb = 1024

[verifier]
environment_mode = "separate"
timeout_sec = 120

[[verifier.collect]]
service = "clinic"
command = "python /app/control.py collect"
timeout_sec = 40

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 512
