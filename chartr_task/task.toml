schema_version = "1.4"
artifacts = [{ source = "/evidence/snapshot.json", service = "clinic" }]

[task]
name = "chartr/treatment-review"
version = "0.2.0"
description = "Reconcile treatment-review and follow-up queues for ten synthetic patients"

[agent]
timeout_sec = 1200

[environment]
network_mode = "public"
build_timeout_sec = 600
cpus = 1
memory_mb = 1024

[verifier]
environment_mode = "separate"
timeout_sec = 120

[[verifier.collect]]
service = "clinic"
command = "python /app/control.py collect"
timeout_sec = 40

[verifier.environment]
network_mode = "public"
cpus = 1
memory_mb = 512
